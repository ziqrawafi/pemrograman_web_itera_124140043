<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Latihan 2 - Loop & Fungsi</title><style>body{font-family:system-ui,sans-serif;max-width:820px;margin:20px auto;padding:0 14px;line-height:1.5}h2{border-bottom:2px solid #1f6f50;padding-bottom:4px;margin-top:28px}section{margin-bottom:10px}input,button,select{padding:7px 9px;font:inherit;margin:2px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}pre{background:#f3f5f4;padding:10px;white-space:pre-wrap}.err{color:#c0392b}.ok{color:#1f6f50}body.dark{background:#161a18;color:#e8ece9}body.dark pre{background:#222826}body.dark input,body.dark button{background:#2a312e;color:#e8ece9;border:1px solid #555}body.dark th,body.dark td{border-color:#555}</style></head>
<body><h1>Latihan 2: Loop & Fungsi</h1>

<h2>1. Tabel perkalian</h2>
<input type="number" id="angka-kali" value="7"> <button id="btn-kali">Tampilkan</button>
<pre id="out-kali"></pre>

<h2>2. Faktorial</h2>
<input type="number" id="angka-fak" value="5" min="0"> <button id="btn-fak">Hitung</button>
<p id="out-fak"></p>

<h2>3. Bilangan prima</h2>
<input type="number" id="angka-prima" value="17"> <button id="btn-prima">Cek</button>
<p id="out-prima"></p>

<h2>4. Kalkulator BMI</h2>
<input type="number" id="berat" placeholder="Berat (kg)"> <input type="number" id="tinggi" placeholder="Tinggi (cm)"> <button id="btn-bmi">Hitung BMI</button>
<p id="out-bmi"></p>

<h2>5. FizzBuzz (1-100)</h2>
<pre id="out-fizz"></pre>

<script>
const $ = (id) => document.getElementById(id);

// 1. Tabel perkalian 1-10
function tabelPerkalian(n) {
  let hasil = "";
  for (let i = 1; i <= 10; i++) {
    hasil += n + " x " + i + " = " + (n * i) + "\n";
  }
  return hasil;
}
$("btn-kali").addEventListener("click", () => {
  $("out-kali").textContent = tabelPerkalian(Number($("angka-kali").value));
});

// 2. Faktorial
function faktorial(n) {
  if (!Number.isInteger(n) || n < 0) return null;
  let hasil = 1;
  for (let i = 2; i <= n; i++) hasil *= i;
  return hasil;
}
$("btn-fak").addEventListener("click", () => {
  const n = Number($("angka-fak").value);
  const f = faktorial(n);
  $("out-fak").textContent = f === null ? "Masukkan bilangan bulat >= 0." : n + "! = " + f;
});

// 3. Bilangan prima
function isPrima(n) {
  if (!Number.isInteger(n) || n < 2) return false;
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) return false;
  }
  return true;
}
$("btn-prima").addEventListener("click", () => {
  const n = Number($("angka-prima").value);
  $("out-prima").textContent = n + (isPrima(n) ? " adalah bilangan prima." : " bukan bilangan prima.");
});

// 4. BMI
function hitungBMI(beratKg, tinggiCm) {
  const m = tinggiCm / 100;
  return beratKg / (m * m);
}
function kategoriBMI(bmi) {
  if (bmi < 18.5) return "Kurus";
  if (bmi < 25) return "Normal";
  if (bmi < 30) return "Gemuk";
  return "Obesitas";
}
$("btn-bmi").addEventListener("click", () => {
  const berat = parseFloat($("berat").value);
  const tinggi = parseFloat($("tinggi").value);
  const out = $("out-bmi");
  if (isNaN(berat) || isNaN(tinggi) || berat <= 0 || tinggi <= 0) {
    out.className = "err";
    out.textContent = "Masukkan berat dan tinggi yang valid.";
    return;
  }
  const bmi = hitungBMI(berat, tinggi);
  out.className = "ok";
  out.textContent = "BMI: " + bmi.toFixed(1) + " (" + kategoriBMI(bmi) + ")";
});

// 5. FizzBuzz
let fizz = [];
for (let i = 1; i <= 100; i++) {
  if (i % 15 === 0) fizz.push("FizzBuzz");
  else if (i % 3 === 0) fizz.push("Fizz");
  else if (i % 5 === 0) fizz.push("Buzz");
  else fizz.push(i);
}
$("out-fizz").textContent = fizz.join(", ");
</script></body></html>
