<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Latihan 3 - Array & Objek</title><style>body{font-family:system-ui,sans-serif;max-width:820px;margin:20px auto;padding:0 14px;line-height:1.5}h2{border-bottom:2px solid #1f6f50;padding-bottom:4px;margin-top:28px}section{margin-bottom:10px}input,button,select{padding:7px 9px;font:inherit;margin:2px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}pre{background:#f3f5f4;padding:10px;white-space:pre-wrap}.err{color:#c0392b}.ok{color:#1f6f50}body.dark{background:#161a18;color:#e8ece9}body.dark pre{background:#222826}body.dark input,body.dark button{background:#2a312e;color:#e8ece9;border:1px solid #555}body.dark th,body.dark td{border-color:#555}</style></head>
<body><h1>Latihan 3: Array & Objek</h1>

<div>
  <button id="btn-semua">Semua</button>
  <button id="btn-tertinggi">Nilai tertinggi</button>
  <button id="btn-atas">Di atas rata-rata</button>
  <button id="btn-asc">Nama A-Z</button>
  <button id="btn-desc">Nama Z-A</button>
</div>
<p id="info"></p>
<table><thead><tr><th>No</th><th>Nama</th><th>NIM</th><th>Jurusan</th><th>Nilai</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table>

<h2 id="judul-form">Tambah mahasiswa</h2>
<input id="f-nama" placeholder="Nama"> <input id="f-nim" placeholder="NIM"> <input id="f-jurusan" placeholder="Jurusan"> <input id="f-nilai" type="number" placeholder="Nilai">
<button id="btn-simpan">Simpan</button> <button id="btn-batal" hidden>Batal</button>
<p id="err" class="err"></p>

<script>
const $ = (id) => document.getElementById(id);

// Array minimal 5 objek mahasiswa
let mahasiswa = [
  { nama: "Budi Santoso", nim: "20210001", jurusan: "Teknik Informatika", nilai: 85 },
  { nama: "Siti Aminah", nim: "20210002", jurusan: "Teknik Informatika", nilai: 92 },
  { nama: "Andi Wijaya", nim: "20210003", jurusan: "Sistem Informasi", nilai: 78 },
  { nama: "Dewi Lestari", nim: "20210004", jurusan: "Teknik Informatika", nilai: 88 },
  { nama: "Rizki Pratama", nim: "20210005", jurusan: "Sistem Informasi", nilai: 70 }
];
let editIndex = -1;

const rataRata = () => mahasiswa.reduce((s, m) => s + m.nilai, 0) / mahasiswa.length;

// Tampilkan data dalam tabel HTML
function render(daftar = mahasiswa) {
  const tbody = $("tbody");
  tbody.innerHTML = "";
  daftar.forEach((m, i) => {
    const tr = document.createElement("tr");
    [i + 1, m.nama, m.nim, m.jurusan, m.nilai].forEach(v => {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    });
    const aksi = document.createElement("td");
    const bEdit = document.createElement("button");
    bEdit.textContent = "Edit";
    bEdit.onclick = () => mulaiEdit(mahasiswa.indexOf(m));
    const bHapus = document.createElement("button");
    bHapus.textContent = "Hapus";
    bHapus.onclick = () => hapus(mahasiswa.indexOf(m));
    aksi.append(bEdit, bHapus);
    tr.appendChild(aksi);
    tbody.appendChild(tr);
  });
}

// Mencari nilai tertinggi dengan method array
function cariTertinggi() {
  return mahasiswa.reduce((maks, m) => (m.nilai > maks.nilai ? m : maks));
}
// Filter di atas rata-rata
function diAtasRataRata() {
  const rata = rataRata();
  return mahasiswa.filter(m => m.nilai > rata);
}
// Urutkan berdasarkan nama (salinan, agar array asli tetap)
function urutkanNama(arah) {
  const hasil = [...mahasiswa].sort((a, b) => a.nama.localeCompare(b.nama));
  return arah === "asc" ? hasil : hasil.reverse();
}

$("btn-semua").onclick = () => { $("info").textContent = "Rata-rata nilai: " + rataRata().toFixed(2); render(); };
$("btn-tertinggi").onclick = () => {
  const t = cariTertinggi();
  $("info").textContent = "Nilai tertinggi: " + t.nama + " (" + t.nilai + ")";
  render([t]);
};
$("btn-atas").onclick = () => {
  $("info").textContent = "Di atas rata-rata (" + rataRata().toFixed(2) + ")";
  render(diAtasRataRata());
};
$("btn-asc").onclick = () => { $("info").textContent = "Diurutkan A-Z"; render(urutkanNama("asc")); };
$("btn-desc").onclick = () => { $("info").textContent = "Diurutkan Z-A"; render(urutkanNama("desc")); };

// CRUD: Create & Update
function simpan() {
  const data = {
    nama: $("f-nama").value.trim(),
    nim: $("f-nim").value.trim(),
    jurusan: $("f-jurusan").value.trim(),
    nilai: Number($("f-nilai").value)
  };
  if (!data.nama || !data.nim || !data.jurusan || $("f-nilai").value === "" || data.nilai < 0 || data.nilai > 100) {
    $("err").textContent = "Semua kolom wajib diisi, nilai 0-100.";
    return;
  }
  $("err").textContent = "";
  if (editIndex === -1) mahasiswa.push(data);
  else mahasiswa[editIndex] = data;
  resetForm();
  render();
}
// Update: isi form dengan data lama
function mulaiEdit(i) {
  const m = mahasiswa[i];
  $("f-nama").value = m.nama; $("f-nim").value = m.nim;
  $("f-jurusan").value = m.jurusan; $("f-nilai").value = m.nilai;
  editIndex = i;
  $("judul-form").textContent = "Edit mahasiswa";
  $("btn-batal").hidden = false;
}
// Delete
function hapus(i) {
  mahasiswa.splice(i, 1);
  resetForm();
  render();
}
function resetForm() {
  ["f-nama", "f-nim", "f-jurusan", "f-nilai"].forEach(id => $(id).value = "");
  editIndex = -1;
  $("judul-form").textContent = "Tambah mahasiswa";
  $("btn-batal").hidden = true;
}
$("btn-simpan").onclick = simpan;
$("btn-batal").onclick = resetForm;

render();
</script></body></html>
